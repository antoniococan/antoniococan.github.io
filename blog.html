    <!-- Footer-->
    <footer class="bg-bottom text-center py-5">
        <div class="container px-5">
            <div class="text-white-50 small">
                <div id="copyright-text"></div>
                <div id="last-updated" class="mb-2"></div>
                <a id="github-link" href="https://github.com/username">Github</a>
                <span class="mx-1">&middot;</span>
                <a id="license-link" href="https://github.com/username/username.github.io/blob/main/LICENSE">License</a>
            </div>
        </div>
    </footer>
    
<script>
fetch('contents/config.yml')
    .then(response => response.text())
    .then(config => {
        const copyright = config.match(/copyright-text:\s*["']?(.+?)["']?\s*$/m);
        const lastUpdated = config.match(/last-updated:\s*["']?(.+?)["']?\s*$/m);

        if (copyright) {
            document.getElementById('copyright-text').textContent =
                copyright[1].replace(/^["']|["']$/g, '');
        }

        if (lastUpdated) {
            document.getElementById('last-updated').textContent =
                lastUpdated[1].replace(/^["']|["']$/g, '');
        }
    })
    .catch(error => console.error('Could not load footer config:', error));
</script>
